name: checks

on:
  push:
  pull_request:

# Linting and type checking only ever read the checkout. Stated at the top so
# any job added later starts from the same floor rather than the repository
# default, which is write.
permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every interpreter `requires-python` admits. The functional suite needs
        # a daemon and runs locally, so importing the package is the only
        # runtime check CI can make — and it is the one that catches a version
        # floor the code cannot actually meet.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run python -c "import pylbry; pylbry.Client"
