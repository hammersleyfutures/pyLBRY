[project]
name = "pylbry"
version = "0.1.0"
description = "A modern python library for interacting with the LBRY network."
readme = "README.md"
authors = [
    { name = "Ben Hammersley", email = "ben@hammersleyfutures.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1,<0.29.0"]
keywords = ["lbry", "lbrynet", "archiving", "json-rpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hammersleyfutures/pyLBRY"
Source = "https://github.com/hammersleyfutures/pyLBRY"
Issues = "https://github.com/hammersleyfutures/pyLBRY/issues"

[project.scripts]
pylbry = "pylbry.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "ruff>=0.16.1,<0.17.0",
  "ty>=0.0.65,<0.1.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "pytest-xdist>=3.8.0,<4.0.0",
]

# Both checkers target the oldest supported interpreter, not the newest. Aimed
# at the newest they would accept syntax and semantics that `requires-python`
# promises will run, and 3.12 cannot.
[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
all = "error"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
preview = true
select = ["E","W","F","I","N","D","UP","B","A","C4","SIM","RUF",
          "ANN","PYI","PTH","TID","ERA","PL","T20","DOC"]

[tool.ruff.lint.isort]
# 3.14 evaluates annotations lazily and the code relies on it, referring to
# types before they are defined. Below 3.14 that is a NameError at import, so
# every module states the behaviour rather than inheriting it.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/pylbry/cli.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Worker count is capped at 4, not `auto`: the bottleneck is one shared lbrynet
# daemon, not CPU count, and `auto` spawns one worker per core against it.
addopts = "-q --strict-markers --strict-config -n 4 --dist loadgroup --cov --cov-report=term-missing"
markers = ["live: requires a running lbrynet daemon"]

[tool.coverage.run]
branch = true
source = ["src/pylbry"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "@overload"]
